name: Build Windows CUDA (b10797 + PR 22575)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout llama.cpp at b10797
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b10797            # tag b10797 -> commit 832fd6f
          fetch-depth: 0

      - name: Configure git identity (for merge commit)
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI Bot"

      - name: Merge PR 22575 on top of b10797
        shell: bash
        run: |
          git fetch origin pull/22575/head:pr-22575
          git merge --no-edit pr-22575

      - name: Install CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install -y ninja

      - name: Configure & build (server + CUDA)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=86
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack binaries
        run: |
          mkdir artifacts
          7z a -snl artifacts\llama-b10797-pr22575-win-cuda-12.4-x64.zip .\build\bin\Release\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-b10797-pr22575-win-cuda-12.4-x64.zip
          path: artifacts\llama-b10797-pr22575-win-cuda-12.4-x64.zip
